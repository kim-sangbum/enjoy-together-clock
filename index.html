<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Enjoy Together 시계 게임</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body { margin: 0; font-family: 'Malgun Gothic', sans-serif; overflow: hidden; user-select: none; }
    /* 모바일 터치 시 생기는 기본 회색/파란색 음영 완벽 제거 */
    button { -webkit-tap-highlight-color: transparent; }
    .floating { animation: float 3s ease-in-out infinite; position: absolute; font-size: 2.5rem; z-index: 0; opacity: 0.6; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    .progress-bar { transition: width 1s linear, background-color 0.3s; }
    .popup-bounce { animation: popup 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    @keyframes popup { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const ClockFace = ({ h, m, size = 180, borderColor = "border-gray-100" }) => (
      <svg width={size} height={size} viewBox="0 0 100 100" className={`bg-white rounded-full shadow-inner border-4 transition-colors duration-1000 ${borderColor}`}>
        <circle cx="50" cy="50" r="48" fill="white" />
        {[...Array(12)].map((_, i) => (
          <text key={i} x="50" y="16" transform={`rotate(${i * 30}, 50, 50)`} textAnchor="middle" fill="#4B5563" fontSize="9" fontWeight="bold">
            {i === 0 ? 12 : i}
          </text>
        ))}
        <line x1="50" y1="50" x2="50" y2="25" stroke="#374151" strokeWidth="3.5" strokeLinecap="round" transform={`rotate(${(h % 12) * 30 + m * 0.5}, 50, 50)`} />
        <line x1="50" y1="50" x2="50" y2="15" stroke="#F472B6" strokeWidth="2.5" strokeLinecap="round" transform={`rotate(${m * 6}, 50, 50)`} />
        <circle cx="50" cy="50" r="4" fill="#F472B6" />
      </svg>
    );

    const ClockGame = () => {
      const [level, setLevel] = useState(1);
      const [timeRemaining, setTimeRemaining] = useState(180);
      const [isPlaying, setIsPlaying] = useState(false);
      const [levelUpPopup, setLevelUpPopup] = useState(0);
      const [targetTime, setTargetTime] = useState({ type: 'read', h: 12, m: 0 });
      const [options, setOptions] = useState([]);
      const [score, setScore] = useState(0);
      const [message, setMessage] = useState("");
      const [lives, setLives] = useState(3);
      const [gameStartDate, setGameStartDate] = useState("");
      const [isMuted, setIsMuted] = useState(false);
      const [questionId, setQuestionId] = useState(0); // 새로 추가: 문제 고유 번호 (버튼 잔상 초기화용)

      const [bestScore, setBestScore] = useState(() => {
        const saved = localStorage.getItem('enjoyClockBestScore');
        return saved ? JSON.parse(saved) : { score: 0, date: null };
      });

      const [bgmAudio] = useState(() => {
        const audio = new Audio('./bgm.mp3');
        audio.loop = true;
        audio.volume = 0.3;
        return audio;
      });

      const playEffectSound = (filename) => {
        if (!isMuted) {
          const snd = new Audio(`./${filename}.mp3`);
          snd.volume = 0.7;
          snd.play().catch(() => {});
        }
      };

      useEffect(() => {
        if (isPlaying && !isMuted) {
          bgmAudio.play().catch(() => {});
        } else {
          bgmAudio.pause();
        }
      }, [isPlaying, isMuted, bgmAudio]);

      const levelConfigs = {
        1: { type: 'read', time: 180, minStep: 30, text: "(정각/30분)", bgColor: "bg-pink-200", badgeColor: "bg-pink-500 text-white", progressColor: "bg-pink-400", borderColor: "border-pink-300", titleColor: "text-pink-600" },
        2: { type: 'read', time: 150, minStep: 5, text: "(5분 단위)", bgColor: "bg-blue-200", badgeColor: "bg-blue-500 text-white", progressColor: "bg-blue-400", borderColor: "border-blue-300", titleColor: "text-blue-600" },
        3: { type: 'read', time: 120, minStep: 1, text: "(1분 단위)", bgColor: "bg-green-200", badgeColor: "bg-green-500 text-white", progressColor: "bg-green-400", borderColor: "border-green-300", titleColor: "text-green-600" },
        4: { type: 'read', time: 120, minStep: 1, text: "(~분 전)", bgColor: "bg-yellow-200", badgeColor: "bg-yellow-500 text-white", progressColor: "bg-yellow-400", borderColor: "border-yellow-300", titleColor: "text-yellow-600" },
        5: { type: 'diff', time: 150, minStep: 5, text: "(시간 차이)", bgColor: "bg-purple-200", badgeColor: "bg-purple-500 text-white", progressColor: "bg-purple-400", borderColor: "border-purple-300", titleColor: "text-purple-600" }
      };

      const getEffectiveLevel = (lvl) => ((lvl - 1) % 5) + 1;
      const getLoopCount = (lvl) => Math.floor((lvl - 1) / 5);
      
      const getAdjustedTime = (lvl) => {
        const effectiveLvl = getEffectiveLevel(lvl);
        const baseTime = levelConfigs[effectiveLvl].time;
        const loopCount = getLoopCount(lvl);
        return Math.max(30, baseTime - (loopCount * 20));
      };

      const formatTime = (h, m, effectiveLvl) => {
        const displayH = h === 0 ? 12 : h;
        if (m === 0) return `${displayH}시 정각`;
        if (effectiveLvl === 4 && m > 30) {
          const nextH = displayH === 12 ? 1 : displayH + 1;
          return `${nextH}시 ${60 - m}분 전`;
        }
        return `${displayH}시 ${m}분`;
      };

      const generateQuestion = (currentLevel) => {
        // 문제 고유 번호를 1 증가시켜 버튼 컴포넌트를 완전히 새로고침(잔상 제거)
        setQuestionId(prev => prev + 1);

        const effectiveLvl = getEffectiveLevel(currentLevel);
        const conf = levelConfigs[effectiveLvl];
        
        if (conf.type === 'read') {
          const h = Math.floor(Math.random() * 12) + 1;
          const m = Math.floor(Math.random() * (60 / conf.minStep)) * conf.minStep;
          setTargetTime({ type: 'read', h, m });

          const newOptions = new Set([formatTime(h, m, effectiveLvl)]);
          
          while(newOptions.size < 4) {
            const r = Math.random();
            let wH = h, wM = m;
            if (r < 0.33) wH = (h % 12) + 1;
            else if (r < 0.66) wM = Math.floor(Math.random() * (60 / conf.minStep)) * conf.minStep;
            else { wH = (h % 12) + 1; wM = Math.floor(Math.random() * (60 / conf.minStep)) * conf.minStep; }
            newOptions.add(formatTime(wH, wM, effectiveLvl));
          }
          setOptions(Array.from(newOptions).sort(() => Math.random() - 0.5));
        } 
        else if (conf.type === 'diff') {
          const h1 = Math.floor(Math.random() * 12) + 1;
          const m1 = Math.floor(Math.random() * 12) * 5; 
          
          const diffs = [10, 15, 20, 30, 40, 45, 50, 60];
          const actualDiff = diffs[Math.floor(Math.random() * diffs.length)];
          
          let totalM = m1 + actualDiff;
          let m2 = totalM % 60;
          let h2 = h1 + Math.floor(totalM / 60);
          if (h2 > 12) h2 -= 12;

          const formatDiff = (d) => d === 60 ? "1시간" : `${d}분`;
          const correctAnswer = formatDiff(actualDiff);

          setTargetTime({ type: 'diff', h1, m1, h2, m2, answer: correctAnswer });

          const newOptions = new Set([correctAnswer]);
          while(newOptions.size < 4) {
             const rDiff = diffs[Math.floor(Math.random() * diffs.length)];
             newOptions.add(formatDiff(rDiff));
          }
          setOptions(Array.from(newOptions).sort(() => Math.random() - 0.5));
        }
      };

      const checkAndSaveBestScore = (finalScore) => {
        if (finalScore > bestScore.score) {
          const newBest = { score: finalScore, date: gameStartDate };
          setBestScore(newBest);
          localStorage.setItem('enjoyClockBestScore', JSON.stringify(newBest));
        }
      };

      const startGame = () => {
        const now = new Date();
        const startTimeStr = `${now.getMonth() + 1}월 ${now.getDate()}일 ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
        
        setGameStartDate(startTimeStr);
        setLevel(1); setScore(0); setLives(3); setIsPlaying(true); setLevelUpPopup(0);
        setTimeRemaining(getAdjustedTime(1));
        generateQuestion(1); setMessage("");
      };

      useEffect(() => {
        let timer;
        if (isPlaying && timeRemaining > 0 && levelUpPopup === 0) {
          timer = setInterval(() => setTimeRemaining(t => t - 1), 1000);
        } else if (timeRemaining === 0 && isPlaying && levelUpPopup === 0) {
          setIsPlaying(false); 
          playEffectSound('wrong');
          setMessage(`시간 초과! 최종 점수: ${score}점`);
          checkAndSaveBestScore(score);
        }
        return () => clearInterval(timer);
      }, [isPlaying, timeRemaining, levelUpPopup]);

      const handleAnswer = (opt, e) => {
        // 혹시 모를 브라우저 포커스 강제 해제
        if (e && e.target) e.target.blur();

        const effectiveLvl = getEffectiveLevel(level);
        let isCorrect = false;
        if (targetTime.type === 'read') {
          isCorrect = opt === formatTime(targetTime.h, targetTime.m, effectiveLvl);
        } else {
          isCorrect = opt === targetTime.answer;
        }

        if (isCorrect) {
          playEffectSound('correct');
          const nextScore = score + 1;
          setScore(nextScore);
          setMessage(""); 

          if (nextScore % 5 === 0) {
            const nextLevel = level + 1; 
            
            if(window.confetti) {
              window.confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#f472b6', '#60a5fa', '#34d399', '#fbbf24', '#a78bfa'] });
            }

            playEffectSound('levelup');
            setLevelUpPopup(nextLevel);
            
            setTimeout(() => {
              setLevelUpPopup(0);
              setLevel(nextLevel); 
              setTimeRemaining(getAdjustedTime(nextLevel));
              generateQuestion(nextLevel);
            }, 2500);

          } else { generateQuestion(level); }
        } else {
          playEffectSound('wrong');
          const nextLives = lives - 1;
          setLives(nextLives);
          
          if (nextLives <= 0) {
            setIsPlaying(false); 
            setMessage(`하트를 모두 썼어요! 최종 점수: ${score}점`);
            checkAndSaveBestScore(score);
          } else {
            setMessage(`앗, 다시 한번 생각해보세요! (하트 ${nextLives}개 남음)`);
          }
        }
      };

      const currentDisplayLevel = levelUpPopup > 0 ? levelUpPopup : level;
      const effectiveDisplayLevel = getEffectiveLevel(currentDisplayLevel);
      const theme = isPlaying ? levelConfigs[effectiveDisplayLevel] : levelConfigs[1];
      const bgClass = isPlaying || levelUpPopup > 0 ? theme.bgColor : "bg-pink-100";
      
      const isUrgent = timeRemaining <= 10 && isPlaying;
      const progressTextColor = isUrgent ? "text-red-600 animate-pulse font-extrabold" : "text-gray-500 font-bold";
      const progressBarColor = isUrgent ? "bg-red-500 animate-pulse" : theme.progressColor;
      const maxTimeForCurrentLevel = getAdjustedTime(level);

      return (
        <div className={`min-h-screen flex flex-col items-center justify-center relative p-4 z-10 transition-colors duration-1000 ${bgClass}`}>
          
          <button 
            onClick={() => setIsMuted(!isMuted)} 
            className="absolute top-4 right-4 z-30 bg-white/80 p-2 rounded-full shadow text-xl border border-gray-200 active:scale-90 transition-transform"
            title="소리 켜기/끄기"
          >
            {isMuted ? "🔇" : "🎵"}
          </button>

          {bestScore.score > 0 && (
            <div className="absolute top-4 w-full text-center z-20 pointer-events-none">
              <span className="bg-white/80 px-4 py-2 rounded-full shadow text-sm font-bold text-gray-700 border border-gray-100">
                🏆 최고 점수: {bestScore.score}점 <span className="text-xs font-normal text-gray-500">({bestScore.date} 시작)</span>
              </span>
            </div>
          )}

          <div className="floating" style={{top:'12%', left:'8%', animationDelay:'0s'}}>🐰</div>
          <div className="floating" style={{top:'22%', right:'10%', animationDelay:'1s'}}>🐻</div>
          <div className="floating" style={{bottom:'15%', left:'12%', animationDelay:'2s'}}>🐥</div>
          <div className="floating" style={{bottom:'25%', right:'8%', animationDelay:'1.5s'}}>🦄</div>

          <div className="relative bg-white p-6 md:p-8 rounded-3xl shadow-xl w-full max-w-md z-10 text-center border-4 border-white overflow-hidden">
            
            {levelUpPopup > 0 && (
              <div className="absolute inset-0 z-50 flex items-center justify-center bg-white/70 backdrop-blur-sm">
                <div className={`bg-white p-6 rounded-3xl shadow-2xl popup-bounce border-4 ${theme.borderColor}`}>
                  <div className="text-5xl mb-2">🎉</div>
                  <h2 className={`text-4xl font-extrabold mb-2 ${theme.titleColor}`}>Level {levelUpPopup}</h2>
                  <p className="text-gray-600 font-bold">대단해요! 다음 단계로!</p>
                  {getLoopCount(levelUpPopup) > 0 && (
                    <p className="text-red-500 text-sm mt-2 font-bold animate-pulse">점점 시간이 줄어들고 있어요!</p>
                  )}
                </div>
              </div>
            )}

            <h1 className="text-3xl font-extrabold text-pink-500 mb-1 tracking-tight">Enjoy Together</h1>
            <p className="text-gray-500 font-semibold mb-6">시계 맞추기 게임</p>

            {!isPlaying ? (
              <div>
                <div className="text-xl mb-6 text-gray-700 font-bold">{message || "준비되었나요?"}</div>
                <button onClick={startGame} className="bg-pink-400 text-white px-8 py-4 rounded-full text-xl font-bold hover:bg-pink-500 shadow-md transition w-full active:scale-95">
                  {message ? "처음부터 다시하기" : "게임 시작"}
                </button>
              </div>
            ) : (
              <div>
                <div className="flex justify-between items-center mb-3">
                  <span className={`px-3 py-1 rounded-full font-bold text-sm shadow-sm transition-colors duration-1000 ${theme.badgeColor}`}>
                    Level {level} {theme.text}
                  </span>
                  <span className="font-bold text-gray-700 text-lg bg-gray-50 px-3 py-1 rounded-full shadow-sm border border-gray-100">점수: {score}</span>
                </div>

                <div className="flex justify-end mb-1 pr-1">
                  <span className={`text-sm ${progressTextColor}`}>
                    ⏱ 남은 시간: {timeRemaining}초
                  </span>
                </div>
                <div className="w-full bg-gray-100 rounded-full h-3 mb-6 shadow-inner overflow-hidden">
                  <div className={`h-3 rounded-full progress-bar ${progressBarColor}`} style={{ width: `${(timeRemaining / maxTimeForCurrentLevel) * 100}%` }}></div>
                </div>

                {message && <div className="text-pink-500 font-bold mb-4 animate-bounce">{message}</div>}

                {targetTime.type === 'read' ? (
                  <div className="flex justify-center mb-8">
                    <ClockFace h={targetTime.h} m={targetTime.m} size={180} borderColor={theme.borderColor} />
                  </div>
                ) : (
                  <div className="mb-8">
                    <p className="text-gray-600 font-bold mb-3 text-sm">두 시계는 시간이 얼마나 지났을까요?</p>
                    <div className="flex justify-center items-center gap-2">
                      <ClockFace h={targetTime.h1} m={targetTime.m1} size={110} borderColor={theme.borderColor} />
                      <span className="text-2xl font-bold text-gray-300">➔</span>
                      <ClockFace h={targetTime.h2} m={targetTime.m2} size={110} borderColor={theme.borderColor} />
                    </div>
                  </div>
                )}

                {/* 핵심 수정 영역: key에 questionId를 넣어서 문제가 바뀔 때마다 버튼을 아예 새로 만들게 합니다 */}
                <div className="grid grid-cols-2 gap-3 mb-6" key={questionId}>
                  {options.map((opt, i) => (
                    <button key={`${questionId}-${i}`} onClick={(e) => handleAnswer(opt, e)} className="bg-gray-50 border-2 border-gray-100 p-3 rounded-xl font-bold text-gray-700 transition focus:outline-none active:bg-gray-200 active:scale-95 text-sm md:text-base shadow-sm lg:hover:bg-gray-100">
                      {opt}
                    </button>
                  ))}
                </div>

                <div className="flex justify-center gap-2 text-2xl pt-2 border-t border-gray-100">
                  {[1, 2, 3].map(i => (
                    <span key={i} className={`transition-all duration-300 ${i <= lives ? "scale-110" : "grayscale opacity-30 scale-90"}`}>
                      ❤️
                    </span>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ClockGame />);
  </script>
</body>
</html>
